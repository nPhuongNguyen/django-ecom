version: '3.9'

services:
  mysql:
    image: mysql:8.0
    container_name: mysql_server
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: django-ecom
      MYSQL_USER: mysql
      MYSQL_PASSWORD: mysql
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  adminer:
    image: adminer
    container_name: adminer_ui
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - mysql

  redis_auth:
    image: redis:7
    container_name: redis_auth
    restart: always
    command: >
      redis-server
      --requirepass redis_auth
    ports:
      - "6379:6379"
    volumes:
      - redis_auth_data:/data

  redis_default:
    image: redis:7
    container_name: redis_default
    restart: always
    command: >
      redis-server
      --requirepass redis_default
    ports:
      - "6380:6379"
    volumes:
      - redis_default_data:/data

  minio:
    image: minio/minio:latest
    container_name: minio_server
    restart: always
    ports:
      - "9009:9000"   # API
      - "9001:9001"   # Console
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: admin123
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant_server
    ports:
      - "6333:6333" # Port cho REST API và Dashboard Web UI
      - "6334:6334" # Port cho gRPC (Nếu sau này bạn muốn tối ưu tốc độ kết nối)
    volumes:
      - qdrant_data:/qdrant/storage
      - qdrant_config:/qdrant/config
    environment:
      - QDRANT__SERVICE__ENABLE_STATIC_CONTENT=true # Kích hoạt Web UI Dashboard
    restart: unless-stopped

volumes:
  mysql_data:
  redis_auth_data:
  redis_default_data:
  minio_data:
  qdrant_data:
    driver: local
  qdrant_config:
    driver: local