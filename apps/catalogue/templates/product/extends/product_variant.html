{% load static i18n %}
{% if pk_product %}
    <div class="kt-card">
        <div class="kt-card-header d-flex justify-content-between align-items-center">
        <h3 class="kt-card-title mb-0">{% trans 'Product Variants' %}</h3>
        <button type="button" class="kt-btn kt-btn-primary" data-kt-modal-toggle="#modal_product_variant">{% trans 'Add Product Variant' %}</button>
        </div>
        <div class="kt-card-table" data-kt-datatable="true">
        <div class="kt-table-wrapper">
            <table class="kt-table hover cursor-pointer" id="datatables-product-variants" 
                data-kt-datatable-table="true" 
                data-url-variant="{% url 'ProductVariantListAPI' %}?product={{ pk_product }}" 
                data-url-change-status-variant="{% url 'ProductVariantChangeStatusAPI' pk='__pk__' %}" 
                data-url-delete-variant="{% url 'ProductVariantDestroyAPI' %}" 
                data-url-detail-variant="{% url 'ProductVariantDetailView' pk='__pk__' %}" 
            >
            <thead>
                <tr>
                <th scope="col" class="w-30" data-kt-datatable-column="label">
                    {% trans 'Name' %}
                </th>
                <th scope="col" class="w-30" data-kt-datatable-column="label">
                    {% trans 'SKU' %}
                </th>
                <th scope="col" class="w-30" data-kt-datatable-column="label">
                    {% trans 'Stock' %}
                </th>
                <th scope="col" class="w-30" data-kt-datatable-column="label">
                    {% trans 'Price' %}
                </th>
                <th scope="col" class="w-30" data-kt-datatable-column="label">
                    {% trans 'Status' %}
                </th>
                </tr>
                <tr class="dt-filter-row">
                <th></th>
                <th></th>
                <th></th>
                <th></th>
                <th>
                    {% include 'extends/filter/status.html' %}
                </th>
                </tr>
            </thead>
            </table>
        </div>
        </div>
    </div>
    <div>
        <form id="frm_modal_variant" data-url="{% url 'ProductVariantCreateAPI' %}" data-url-upload="{% url 'UploadImageAPI' %}">
            <div class="kt-modal kt-modal-center" data-kt-modal="true" id="modal_product_variant">
                <div class="kt-modal-content max-w-[70%] border-0">
                    <div class="kt-modal-header border-0 bg-blue-500 rounded-t-lg">
                    <h3 class="kt-modal-title text-white">Product Variant</h3>
                    <button type="button" class="kt-modal-close text-white" aria-label="Close modal" data-kt-modal-dismiss="#modal">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-x" aria-hidden="true">
                        <path d="M18 6 6 18"></path>
                        <path d="m6 6 12 12"></path>
                        </svg>
                    </button>
                    </div>
                    <div class="kt-modal-body max-h-[70vh]">
                        <input type="hidden" name="product" value={{ pk }} />
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div class="kt-form-item">
                            <label class="kt-form-label required" for="inp_name">{% trans 'Name' %}:</label>
                            <div class="kt-form-control">
                                <input id="inp_name" type="text" class="kt-input w-full" name="name" required />
                            </div>
                            <div class="kt-form-description"></div>
                            </div>
                            <div class="kt-form-item">
                            <label class="kt-form-label required" for="inp_sku">{% trans 'SKU' %}:</label>
                            <div class="kt-form-control">
                                <input id="inp_sku" class="kt-input w-full resize-y" name="sku" required />
                            </div>
                            <div class="kt-form-description"></div>
                            </div>
                        </div>
                        <div class="grid grid-cols-3 gap-4">
                            <div class="kt-form-item">
                            <label class="kt-form-label" for="inp_price">{% trans 'Price' %}:</label>
                            <div class="kt-form-control">
                                <input id="inp_price" type="text" name="price" class="kt-input w-full" required />
                            </div>
                            </div>
                            <div class="kt-form-item">
                            <label class="kt-form-label" for="inp_stock">{% trans 'Stock' %}:</label>
                            <div class="kt-form-control">
                                <input id="inp_stock" type="number" min="0" value="0" name="stock_qty" class="kt-input w-full" required />
                            </div>
                            </div>
                            <div class="kt-form-item">
                            <label class="kt-form-label" for="inp_is_active">{% trans 'Status' %}:</label>
                            <div class="kt-form-control">
                                <input class="kt-switch kt-switch-lg" type="checkbox" id="inp_is_active" name="is_active" checked="" />
                            </div>
                            </div>
                        </div>
                        <div class="kt-form-item mt-6">
                            <div>
                            <button class="kt-btn" data-kt-modal-toggle="#modal">Show Modal</button>
                            <div class="kt-modal" data-kt-modal="true" id="modal">
                                <div class="kt-modal-content max-w-[400px] top-[10%]">
                                <div class="kt-modal-header">
                                    <h3 class="kt-modal-title">Modal Title</h3>
                                    <button
                                    type="button"
                                    class="kt-modal-close"
                                    aria-label="Close modal"
                                    data-kt-modal-dismiss="#modal"
                                    >
                                    <svg
                                        xmlns="http://www.w3.org/2000/svg"
                                        width="24"
                                        height="24"
                                        viewBox="0 0 24 24"
                                        fill="none"
                                        stroke="currentColor"
                                        stroke-width="2"
                                        stroke-linecap="round"
                                        stroke-linejoin="round"
                                        class="lucide lucide-x"
                                        aria-hidden="true"
                                    >
                                        <path d="M18 6 6 18"></path>
                                        <path d="m6 6 12 12"></path>
                                    </svg>
                                    </button>
                                </div>
                                <div class="kt-modal-body">
                                    <div class="rounded-lg bg-muted w-full grow h-[200px]"></div>
                                </div>
                                </div>
                            </div>
                            </div>

                        </div>
                        <div class="kt-form-item mt-6">
                            <label class="kt-form-label">Hình ảnh:</label>
                            <div class="kt-form-control">
                            <div id="image_product_variant"></div>
                            </div>
                            <div class="kt-form-description"></div>
                        </div>
                    </div>
                    <div class="kt-modal-footer gap-2.5 justify-end border-0">
                        <div class="flex gap-4">
                            <button class="kt-btn kt-btn-secondary" data-kt-modal-dismiss="#modal-variant" type="button">Cancel</button>
                            <button class="kt-btn" type="submit">Save</button>
                        </div>
                    </div>
                </div>
            </div>
        </form>
    </div>
  <script src="{% static 'products/extends/product_variant.js' %}"></script>
{% endif %}
